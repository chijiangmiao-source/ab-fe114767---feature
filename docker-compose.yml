services:
  web:
    build: .
    image: deep-space-receiver:latest
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/receiver.db
    ports:
      # Host port is configurable: HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - receiver-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  verify:
    build: .
    image: deep-space-receiver:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:8080
    entrypoint: ["/srv/scripts/verify.sh"]
    restart: "no"

volumes:
  receiver-data:
