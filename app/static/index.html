<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深空地面站 · 帧接收器</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #131a27; --panel2: #1a2334; --line: #26324a;
    --text: #e6ecf5; --muted: #8ea0bc; --accent: #4fa3ff;
    --ok: #34d399; --dup: #fbbf24; --exp: #f87171; --rej: #c084fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #101826, #0b0f17);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  textarea { resize: vertical; min-height: 64px; }
  button {
    margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 6px;
    background: var(--accent); color: #07111f; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .link-item {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 8px; cursor: pointer; background: var(--panel2);
  }
  .link-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .link-item .nm { font-weight: 600; }
  .link-item .id { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat {
    flex: 1; min-width: 130px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px;
  }
  .stat .k { color: var(--muted); font-size: 11px; }
  .stat .v { font-size: 18px; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 2px; }
  .bits { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .bit {
    width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
  }
  .bit.set { background: rgba(79,163,255,.25); border-color: var(--accent); color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; }
  td.mono { font-family: ui-monospace, monospace; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.accepted { background: rgba(52,211,153,.18); color: var(--ok); }
  .badge.duplicate { background: rgba(251,191,36,.18); color: var(--dup); }
  .badge.expired { background: rgba(248,113,113,.18); color: var(--exp); }
  .badge.rejected { background: rgba(192,132,252,.18); color: var(--rej); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  #verdict { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
  .stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
  .station-card {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; cursor: pointer;
  }
  .station-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .station-card.primary { border-left: 3px solid var(--accent); }
  .station-card.secondary { border-left: 3px solid var(--ok); }
  .station-card .role { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .station-card .hi { font-size: 20px; font-weight: 700; font-family: ui-monospace, monospace; margin: 3px 0 6px; }
  .mini-positions { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
                    max-height: 74px; overflow: auto; line-height: 1.5; }
  .snap-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .snap-row input { flex: 1; min-width: 140px; }
  button.small { width: auto; margin-top: 0; padding: 7px 12px; font-size: 12px; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .conv-box { margin-top: 14px; border: 1px solid var(--ok); border-radius: 8px; padding: 12px; background: rgba(52,211,153,.07); }
  .conv-box h3 { margin: 0 0 8px; font-size: 13px; color: var(--ok); }
  .conv-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .conv-cols .mono { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--text); word-break: break-all; }
  .pill { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: rgba(79,163,255,.2); color: var(--accent); }
  .pill.snap { background: rgba(52,211,153,.18); color: var(--ok); }
  .snap-id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>🛰️ 深空地面站 · 32 位帧计数滑动窗口接收器</h1>
  <p>64 位扩展序号 + 64 位位图 · 最近纪元候选裁决 · 回执标识去重 · SQLite 单事务持久化</p>
</header>

<div class="layout">
  <div>
    <div class="panel">
      <h2>创建链路</h2>
      <label for="lnk-name">链路名称</label>
      <input id="lnk-name" placeholder="例如 Voyager-1 下行">
      <button onclick="createLink()">创建链路</button>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>链路列表</h2>
      <div id="link-list"><div class="empty">尚无链路</div></div>
      <button class="secondary" onclick="loadLinks()">刷新</button>
    </div>
  </div>

  <div class="panel" id="main-panel">
    <div class="empty">请选择或创建一条链路</div>
  </div>
</div>

<script>
let currentLink = null;
let currentStation = null;   // null = primary station
let linkState = null;

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

async function createLink() {
  const name = document.getElementById("lnk-name").value.trim() || "link";
  const r = await api("POST", "/api/links", { name });
  if (r.ok) { document.getElementById("lnk-name").value = ""; await loadLinks(); selectLink(r.data.id); }
  else alert("创建失败: " + (r.data.error || r.status));
}

async function loadLinks() {
  const r = await api("GET", "/api/links");
  const box = document.getElementById("link-list");
  if (!r.ok || !r.data.links.length) { box.innerHTML = '<div class="empty">尚无链路</div>'; return; }
  box.innerHTML = r.data.links.map(l =>
    `<div class="link-item ${currentLink === l.id ? 'active' : ''}" onclick="selectLink('${l.id}')">
       <div class="nm">${escapeHtml(l.name)}</div>
       <div class="id">${l.id}</div>
     </div>`).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function selectLink(id) {
  currentLink = id;
  currentStation = null;
  await refreshLink();
  await loadLinks();
}

async function refreshLink() {
  const r = await api("GET", "/api/links/" + currentLink);
  if (!r.ok) return;
  linkState = r.data;
  // keep selection valid if a station disappeared
  if (currentStation !== null
      && !linkState.stations.some(s => s.id === currentStation)) {
    currentStation = null;
  }
  renderMain(linkState);
}

// Re-fetch and repaint only the station cards and current recent table,
// preserving the frame form inputs and any convergence result shown.
async function repaintLive() {
  const r = await api("GET", "/api/links/" + currentLink);
  if (!r.ok) return;
  linkState = r.data;
  if (currentStation !== null
      && !linkState.stations.some(s => s.id === currentStation)) {
    currentStation = null;
    renderTarget();
  }
  renderCards();
  paintTarget();
}

function stationList() {
  const primary = { id: null, name: "主站 (primary)", highest: linkState.highest,
                    bitmap: linkState.bitmap, recent: linkState.recent, role: "primary" };
  const seconds = (linkState.stations || []).map(s => ({ ...s, role: "secondary" }));
  return [primary, ...seconds];
}

function renderMain(l) {
  document.getElementById("main-panel").innerHTML = `
    <h2 style="margin-top:0">链路 <span id="m-name"></span>
      <span class="pill" id="m-id"></span></h2>

    <div class="stations" id="station-cards"></div>

    <div class="snap-row">
      <button class="small ghost" onclick="createSnapshot()">📸 建立同源快照</button>
      <span class="snap-id" id="snap-info"></span>
    </div>
    <div class="snap-row">
      <input id="st-name" placeholder="副站名称（可选）">
      <input id="st-snapshot" placeholder="粘贴 snapshot_id">
      <button class="small" onclick="createStation()">从快照建立副站</button>
    </div>
    <div class="hint">副站只能从本链路的明确快照建立；窗口以快照为共同基准校准扩展序号。</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px">
      <div>
        <h2>向 <span id="target-name"></span> 提交到达帧</h2>
        <label>无符号 32 位计数 counter</label>
        <input id="f-counter" placeholder="0 .. 4294967295" inputmode="numeric">
        <label>稳定回执标识 receipt_id</label>
        <input id="f-receipt" placeholder="例如 tx-0001">
        <label>载荷 payload（任意 JSON）</label>
        <textarea id="f-payload">{"sensor":"temp","value":2.7}</textarea>
        <button onclick="submitFrame()">提交帧</button>
        <div id="verdict"></div>
        <div class="hint">相同 receipt_id + counter + 载荷在任一站重传 → 回放首次裁决；
        复用标识但改变链路/计数/载荷 → 409 拒绝。</div>
      </div>
      <div>
        <h2 id="recent-title">最近 64 个已接受位置</h2>
        <table><thead><tr><th>extended sequence</th></tr></thead>
        <tbody id="m-recent"></tbody></table>
        <div id="converge-area"></div>
      </div>
    </div>`;
  document.getElementById("m-name").textContent = l.name;
  document.getElementById("m-id").textContent = l.id.slice(0, 12) + "…";
  renderCards();
  renderTarget();
}

function renderCards() {
  const box = document.getElementById("station-cards");
  box.innerHTML = stationList().map(s => {
    const active = (s.id ?? null) === currentStation;
    const sid = s.id === null ? "null" : `'${s.id}'`;
    const recent = (s.recent || []).slice(0, 4).join(", ") || "—";
    return `<div class="station-card ${s.role} ${active ? 'active' : ''}"
              onclick="selectStation(${sid})">
        <div class="role">${s.role === "primary" ? "主站 PRIMARY" : "副站 SECONDARY"}</div>
        <div>${escapeHtml(s.name)}
          ${s.role === "secondary"
            ? `<span class="pill snap" title="同源快照 ${s.snapshot_id}">快照 ${s.snapshot_id.slice(0, 6)}…</span>`
            : `<span class="pill">基准链路</span>`}</div>
        <div class="hi">${s.highest === null ? "—" : s.highest}</div>
        <div class="mini-positions">${escapeHtml(recent)}</div>
      </div>`;
  }).join("");
}

function selectStation(sid) {
  currentStation = sid;
  renderCards();
  renderTarget();
}

function currentTarget() {
  return stationList().find(s => (s.id ?? null) === currentStation);
}

// Light repaint of the selected target's name + recent table; does not touch
// the form inputs or the convergence result box.
function paintTarget() {
  const nameEl = document.getElementById("target-name");
  if (!nameEl) return;
  const t = currentTarget();
  nameEl.textContent = t.name;
  document.getElementById("recent-title").textContent =
    `最近 64 个已接受位置 · ${t.name}`;
  const recentEl = document.getElementById("m-recent");
  recentEl.innerHTML = (t.recent && t.recent.length)
    ? t.recent.map(n => `<tr><td class="mono">${n}</td></tr>`).join("")
    : '<tr><td class="empty">暂无</td></tr>';
}

function renderTarget() {
  paintTarget();
  const area = document.getElementById("converge-area");
  area.innerHTML = currentStation === null ? "" :
    `<button onclick="converge()">🔀 与主站收敛</button>
     <div class="hint">投影到较高序号后取并集，窗口外位置丢弃；收敛后两站窗口一致。</div>
     <div id="converge-result"></div>`;
}

async function createSnapshot() {
  const r = await api("POST", `/api/links/${currentLink}/snapshots`, {});
  const info = document.getElementById("snap-info");
  if (!r.ok) { info.textContent = "快照失败: " + (r.data.error || r.status); return; }
  document.getElementById("st-snapshot").value = r.data.id;
  info.innerHTML = `<span class="pill snap">快照</span> 基准 highest=${r.data.highest ?? "—"} · ${r.data.id}`;
}

async function createStation() {
  const snapshot_id = document.getElementById("st-snapshot").value.trim();
  if (!snapshot_id) { alert("请先建立或粘贴 snapshot_id"); return; }
  const name = document.getElementById("st-name").value.trim() || "secondary";
  const r = await api("POST", `/api/links/${currentLink}/stations`,
                      { snapshot_id, name });
  if (!r.ok) { alert("建立副站失败: " + (r.data.error || r.status)); return; }
  document.getElementById("st-name").value = "";
  await refreshLink();
  selectStation(r.data.id);
}

async function submitFrame() {
  const counterRaw = document.getElementById("f-counter").value.trim();
  const receipt = document.getElementById("f-receipt").value.trim();
  let payload;
  try { payload = JSON.parse(document.getElementById("f-payload").value || "null"); }
  catch { setVerdict("载荷不是合法 JSON"); return; }
  if (!counterRaw || !receipt) { setVerdict("counter 与 receipt_id 必填"); return; }
  if (!/^\d+$/.test(counterRaw)) { setVerdict("counter 必须是无符号整数"); return; }
  const counter = Number(counterRaw);
  if (counter > 4294967295) { setVerdict("counter 超出 32 位范围"); return; }

  const path = currentStation === null
    ? `/api/links/${currentLink}/frames`
    : `/api/links/${currentLink}/stations/${currentStation}/frames`;
  const r = await api("POST", path, { counter, receipt_id: receipt, payload });
  const box = document.getElementById("verdict");
  if (!r.ok) {
    box.innerHTML = `<span class="badge rejected">HTTP ${r.status}</span>
      <span style="color:var(--exp)">${escapeHtml(r.data.error || "")}</span>`;
    return;
  }
  const d = r.data;
  const label = { accepted: "接受", duplicate: "重复", expired: "过期", rejected: "拒绝(纪元并列)" }[d.status];
  box.innerHTML = `<span class="badge ${d.status}">${label}</span>
    扩展序号 <b>${d.extended}</b> · 最高 <b>${d.highest}</b>
    ${d.retransmit ? "· 重传回放首次裁决" : ""}`;
  await repaintLive();
}

async function converge() {
  const r = await api("POST",
    `/api/links/${currentLink}/stations/${currentStation}/converge`, {});
  const box = document.getElementById("converge-result");
  if (!r.ok) { box.innerHTML = `<span class="badge rejected">HTTP ${r.status}</span>
    <span style="color:var(--exp)">${escapeHtml(r.data.error || "")}</span>`; return; }
  const d = r.data;
  const fmt = arr => (arr && arr.length) ? arr.join(", ") : "（无）";
  box.innerHTML = `<div class="conv-box">
    <h3>✅ 收敛完成 · 合并最高序号 ${d.highest}</h3>
    <div class="conv-cols">
      <div><div class="hint">副站补入主站的位置</div>
        <div class="mono">${escapeHtml(fmt(d.added_primary))}</div></div>
      <div><div class="hint">主站补入副站的位置</div>
        <div class="mono">${escapeHtml(fmt(d.added_secondary))}</div></div>
    </div></div>`;
  await repaintLive();
}

function setVerdict(msg) {
  document.getElementById("verdict").innerHTML =
    `<span class="badge rejected">${escapeHtml(msg)}</span>`;
}

loadLinks();
</script>
</body>
</html>
