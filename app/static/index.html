<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深空地面站 · 帧接收器</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #131a27; --panel2: #1a2334; --line: #26324a;
    --text: #e6ecf5; --muted: #8ea0bc; --accent: #4fa3ff;
    --ok: #34d399; --dup: #fbbf24; --exp: #f87171; --rej: #c084fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #101826, #0b0f17);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  textarea { resize: vertical; min-height: 64px; }
  button {
    margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 6px;
    background: var(--accent); color: #07111f; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .link-item {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 8px; cursor: pointer; background: var(--panel2);
  }
  .link-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .link-item .nm { font-weight: 600; }
  .link-item .id { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat {
    flex: 1; min-width: 130px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px;
  }
  .stat .k { color: var(--muted); font-size: 11px; }
  .stat .v { font-size: 18px; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 2px; }
  .bits { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .bit {
    width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
  }
  .bit.set { background: rgba(79,163,255,.25); border-color: var(--accent); color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; }
  td.mono { font-family: ui-monospace, monospace; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.accepted { background: rgba(52,211,153,.18); color: var(--ok); }
  .badge.duplicate { background: rgba(251,191,36,.18); color: var(--dup); }
  .badge.expired { background: rgba(248,113,113,.18); color: var(--exp); }
  .badge.rejected { background: rgba(192,132,252,.18); color: var(--rej); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  #verdict { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
</style>
</head>
<body>
<header>
  <h1>🛰️ 深空地面站 · 32 位帧计数滑动窗口接收器</h1>
  <p>64 位扩展序号 + 64 位位图 · 最近纪元候选裁决 · 回执标识去重 · SQLite 单事务持久化</p>
</header>

<div class="layout">
  <div>
    <div class="panel">
      <h2>创建链路</h2>
      <label for="lnk-name">链路名称</label>
      <input id="lnk-name" placeholder="例如 Voyager-1 下行">
      <button onclick="createLink()">创建链路</button>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>链路列表</h2>
      <div id="link-list"><div class="empty">尚无链路</div></div>
      <button class="secondary" onclick="loadLinks()">刷新</button>
    </div>
  </div>

  <div class="panel" id="main-panel">
    <div class="empty">请选择或创建一条链路</div>
  </div>
</div>

<script>
let currentLink = null;

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

async function createLink() {
  const name = document.getElementById("lnk-name").value.trim() || "link";
  const r = await api("POST", "/api/links", { name });
  if (r.ok) { document.getElementById("lnk-name").value = ""; await loadLinks(); selectLink(r.data.id); }
  else alert("创建失败: " + (r.data.error || r.status));
}

async function loadLinks() {
  const r = await api("GET", "/api/links");
  const box = document.getElementById("link-list");
  if (!r.ok || !r.data.links.length) { box.innerHTML = '<div class="empty">尚无链路</div>'; return; }
  box.innerHTML = r.data.links.map(l =>
    `<div class="link-item ${currentLink === l.id ? 'active' : ''}" onclick="selectLink('${l.id}')">
       <div class="nm">${escapeHtml(l.name)}</div>
       <div class="id">${l.id}</div>
     </div>`).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function selectLink(id) {
  const r = await api("GET", "/api/links/" + id);
  if (!r.ok) return;
  currentLink = id;
  renderMain(r.data);
  await loadLinks();
}

function renderMain(l) {
  document.getElementById("main-panel").innerHTML = `
    <h2 style="margin-top:0">链路 <span id="m-name"></span></h2>
    <div class="stat-row">
      <div class="stat"><div class="k">当前最高扩展序号</div><div class="v" id="m-highest"></div></div>
      <div class="stat"><div class="k">窗口大小</div><div class="v">64</div></div>
      <div class="stat"><div class="k">链路 ID</div><div class="v" id="m-id" style="font-size:12px"></div></div>
    </div>
    <div class="hint">位图（位 0 = 最高序号，向右为更旧的位置；蓝底=最近已接受）</div>
    <div class="bits" id="m-bits"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px">
      <div>
        <h2>提交到达帧</h2>
        <label>无符号 32 位计数 counter</label>
        <input id="f-counter" placeholder="0 .. 4294967295" inputmode="numeric">
        <label>稳定回执标识 receipt_id</label>
        <input id="f-receipt" placeholder="例如 tx-0001">
        <label>载荷 payload（任意 JSON）</label>
        <textarea id="f-payload">{"sensor":"temp","value":2.7}</textarea>
        <button onclick="submitFrame()">提交帧</button>
        <div id="verdict"></div>
        <div class="hint">相同 receipt_id + 相同 counter + 相同载荷重放 → 返回首次裁决；
        receipt_id 复用但改变链路/计数/载荷 → 409 拒绝。</div>
      </div>
      <div>
        <h2>最近 64 个已接受位置（扩展序号）</h2>
        <table><thead><tr><th>extended sequence</th></tr></thead>
        <tbody id="m-recent"></tbody></table>
      </div>
    </div>`;
  document.getElementById("m-name").textContent = l.name;
  document.getElementById("m-id").textContent = l.id.slice(0, 12) + "…";
  refreshState(l);
}

function refreshState(l) {
  const highestEl = document.getElementById("m-highest");
  const bitsEl = document.getElementById("m-bits");
  const recentEl = document.getElementById("m-recent");
  if (!highestEl) return;
  highestEl.textContent = l.highest === null ? "—" : String(l.highest);
  const bits = [];
  for (let i = 0; i < 64; i++) {
    const set = l.highest !== null && ((BigInt(l.bitmap) >> BigInt(i)) & 1n) === 1n;
    bits.push(`<div class="bit ${set ? 'set' : ''}" title="highest - ${i}">${i}</div>`);
  }
  bitsEl.innerHTML = bits.join("");
  recentEl.innerHTML = (l.recent && l.recent.length)
    ? l.recent.map(n => `<tr><td class="mono">${n}</td></tr>`).join("")
    : '<tr><td class="empty">暂无</td></tr>';
}

async function submitFrame() {
  const counterRaw = document.getElementById("f-counter").value.trim();
  const receipt = document.getElementById("f-receipt").value.trim();
  let payload;
  try { payload = JSON.parse(document.getElementById("f-payload").value || "null"); }
  catch { setVerdict("载荷不是合法 JSON", "rejected"); return; }
  if (!counterRaw || !receipt) { setVerdict("counter 与 receipt_id 必填", "rejected"); return; }
  if (!/^\d+$/.test(counterRaw)) { setVerdict("counter 必须是无符号整数", "rejected"); return; }
  const counter = Number(counterRaw);
  if (counter > 4294967295) { setVerdict("counter 超出 32 位范围", "rejected"); return; }

  const r = await api("POST", `/api/links/${currentLink}/frames`,
    { counter, receipt_id: receipt, payload });
  const box = document.getElementById("verdict");
  if (!r.ok) {
    box.innerHTML = `<span class="badge rejected">HTTP ${r.status}</span>
      <span style="color:var(--exp)">${escapeHtml(r.data.error || "")}</span>`;
    return;
  }
  const d = r.data;
  const label = { accepted: "接受", duplicate: "重复", expired: "过期", rejected: "拒绝(纪元并列)" }[d.status];
  box.innerHTML = `<span class="badge ${d.status}">${label}</span>
    扩展序号 <b>${d.extended}</b> · 最高 <b>${d.highest}</b>
    ${d.retransmit ? "· 重传回放首次裁决" : ""}`;
  const fresh = await api("GET", "/api/links/" + currentLink);
  if (fresh.ok) refreshState(fresh.data);
}

function setVerdict(msg) {
  document.getElementById("verdict").innerHTML =
    `<span class="badge rejected">${escapeHtml(msg)}</span>`;
}

loadLinks();
</script>
</body>
</html>
